name: Automated tests

on:
  pull_request:
  push:
    branches:
      - main
      - develop

env:
  PHP_VERSION: 8.3
  NODE_VERSION: 22.x

jobs:
  lint:
    name: Lint code
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-
      - run: npm ci
      - run: npm run lint:check

  lint-php:
    name: Lint PHP Code
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          coverage: xdebug
      - id: composer-cache
        run: |
          echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-composer-
      - run: composer install -q --no-ansi --no-interaction --no-progress --prefer-dist
      - run: composer rector:check -- --no-progress-bar --no-diffs
      - run: composer ecs:check -- --no-progress-bar --no-error-table

  build-frontend:
    name: Build frontend
    needs: [lint]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-
      - run: npm ci
      - run: npm run build

  test-backend:
    name: Test backend
    needs: [lint, lint-php]
    runs-on: ubuntu-latest
    services:
      database:
        image: postgres:16
        ports:
          - 5432:5432
        env:
          POSTGRES_DB: votesystem-ci
          POSTGRES_PASSWORD: gh-actions-votesystem
          POSTGRES_USER: gh-actions
        volumes:
          - db-data:/var/lib/postgresql/data
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          coverage: xdebug
          extensions: mbstring, intl, pdo-pgsql
      - id: composer-cache
        run: |
          echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-composer-
      - run: |
          cp .env.ci .env
          composer install -q --no-ansi --no-interaction --no-progress --prefer-dist
          php artisan key:generate
      # The Blade views under test render @vite() tags, which fail hard
      # (ViteManifestNotFoundException) without a real built manifest -
      # phpunit's feature tests genuinely need this, not just a style nit.
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-
      - run: npm ci
      - run: npm run build
      - run: vendor/bin/psalm
      - run: vendor/bin/phpunit --do-not-cache-result
