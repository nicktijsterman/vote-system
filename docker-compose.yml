version: '3.5'

# No .env file is required. All non-secret config below has a working
# default and can be overridden via a real .env file next to this one
# (docker compose reads it automatically) or your shell environment.
# APP_KEY / the admin password / the websockets secret are generated on
# first boot and persisted on the "secrets" volume - see .docker/entrypoint.sh.

x-app-environment: &app-environment
  APP_NAME: 'Vote System'
  APP_ENV: ${APP_ENV:-production}
  APP_DEBUG: ${APP_DEBUG:-false}
  APP_URL: ${APP_URL:-http://localhost:8080}
  VS_ADMIN_NAME: ${VS_ADMIN_NAME:-}
  DB_CONNECTION: pgsql
  DB_HOST: postgres
  DB_PORT: 5432
  DB_DATABASE: ${POSTGRES_DB:-votesystem}
  DB_USERNAME: ${POSTGRES_USER:-votesystem}
  DB_PASSWORD: ${POSTGRES_PASSWORD:-votesystem}
  DB_FOREIGN_KEYS: 'true'
  LOG_CHANNEL: stack
  BROADCAST_DRIVER: reverb
  CACHE_DRIVER: file
  QUEUE_CONNECTION: sync
  SESSION_DRIVER: database
  SESSION_LIFETIME: '120'
  REVERB_APP_ID: vote-system
  REVERB_APP_KEY: vote-system
  # Server-to-server: vote-system reaches Reverb via the internal docker
  # network, not the published host port below.
  REVERB_HOST: vote-system-ws
  REVERB_PORT: '8080'
  REVERB_SCHEME: http
  # Browser-facing: the externally published port (see vote-system-ws's
  # ports: below) - override REVERB_PUBLIC_SCHEME/HOST for a real domain/TLS.
  REVERB_PUBLIC_PORT: '6001'
  REVERB_PUBLIC_SCHEME: ${REVERB_PUBLIC_SCHEME:-http}
  TRUSTED_PROXY_LIST: ${TRUSTED_PROXY_LIST:-}

services:
  vote-system:
    # Change "main" to use a specific version.
    # You can see all tags at https://github.com/users/WesleyKlop/packages/container/vote-system/versions
    image: ghcr.io/wesleyklop/vote-system:main
    #build: .
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost']
      interval: 30s
      timeout: 10s
      retries: 3
    environment: *app-environment
    volumes:
      - ./storage/app:/app/storage/app
      - ./storage/logs:/app/storage/logs
      - secrets:/app/storage/secrets
    networks:
      - net
    ports:
      - '8080:80'
    depends_on:
      postgres:
        condition: service_healthy
    restart: on-failure
  vote-system-ws:
    # Change "main" to use a specific version.
    # You can see all tags at https://github.com/users/WesleyKlop/packages/container/vote-system/versions
    image: ghcr.io/wesleyklop/vote-system:main
    #build: .
    command:
      - php
      - artisan
      - reverb:start
      - --host=0.0.0.0
      - --port=8080
    environment: *app-environment
    volumes:
      - secrets:/app/storage/secrets
    networks:
      - net
    ports:
      - '6001:8080'
    depends_on:
      postgres:
        condition: service_healthy
    restart: on-failure
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-votesystem}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-votesystem}
      POSTGRES_DB: ${POSTGRES_DB:-votesystem}
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-votesystem}']
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - db-data:/var/lib/postgresql/data
    networks:
      - net
    expose:
      - 5432
    restart: on-failure

networks:
  net:

volumes:
  db-data:
  secrets:
